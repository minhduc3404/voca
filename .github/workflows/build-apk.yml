name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: voca-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Artifact (bên trên) đòi login GitHub mới tải được. Release thì tải
      # công khai, không cần login — cập nhật đè lên tag cố định "latest-apk"
      # mỗi lần build để luôn có 1 link duy nhất, ổn định.
      - name: Publish APK to release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Voca APK (build mới nhất)
          body: "APK build tự động từ commit ${{ github.sha }} (nhánh `${{ github.ref_name }}`)."
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk
